<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="100%" height="100%">
<defs>

      <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/>
        <stop offset="40%" stop-color="#0284C7" stop-opacity="0.90"/>
        <stop offset="100%" stop-color="#0369A1" stop-opacity="0.95"/>
      </linearGradient>

      <linearGradient id="waveBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#0284C7" stop-opacity="0.7"/>
      </linearGradient>

      <linearGradient id="glassSpecLeft" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
        <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>

      <linearGradient id="glassSpecRight" x1="100%" y1="0%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
      </linearGradient>

      <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7C3AED"/>
        <stop offset="100%" stop-color="#0891B2"/>
      </linearGradient>

      <radialGradient id="dropGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#A5F3FC" stop-opacity="1"/>
        <stop offset="60%" stop-color="#0891B2" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="glassAura" cx="50%" cy="65%" r="50%">
        <stop offset="0%" stop-color="#0891B2" stop-opacity="0.18"/>
        <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
      </radialGradient>

      <!-- Glass Clip Path for Liquid -->
      <!-- Glass inner silhouette: top width 216, bottom width 176, height 230 -->
      <clipPath id="glassInnerClip">
        <path d="M 232 230 
                 L 248 450 
                 Q 250 460 262 460 
                 L 418 460 
                 Q 430 460 432 450 
                 L 448 230 Z"/>
      </clipPath>
    
<style>

      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
      .title { fill: #64748B; font-size: 13px; font-weight: 500; }
      .sec-hdr { fill: #0891B2; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .card-hdr { fill: #0891B2; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .lbl { fill: #475569; font-size: 13px; font-weight: 500; }
